name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

  # Manual trigger with option to skip pub.dev publish.
  # Use skip_publish: true for the very first release — publish that one
  # manually with `dart pub publish`, configure OIDC automated publishing
  # on pub.dev, then subsequent tag pushes run the full pipeline automatically.
  workflow_dispatch:
    inputs:
      skip_publish:
        description: 'Skip dart pub publish (true = initial release dry-run)'
        required: false
        default: 'false'

permissions:
  contents: write   # create GitHub Release
  id-token: write   # OIDC token for pub.dev

jobs:
  # ── 1. Validate ────────────────────────────────────────────────────────────
  validate:
    name: Format · Analyze · Test · Pana
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: dart analyze --fatal-infos

      - name: Tests
        run: flutter test

      - name: Publish dry-run
        run: dart pub publish --dry-run

      - name: Install pana
        run: dart pub global activate pana

      - name: Pana score gate (release threshold ≥ 120)
        run: |
          score=$(dart pub global run pana --no-warning --json 2>/dev/null | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d['scores']['grantedPoints'])")
          echo "pana score: $score"
          if [ "$score" -lt 120 ]; then
            echo "::error::Pana score $score is below the release threshold of 120."
            exit 1
          fi

  # ── 2. Publish to pub.dev (OIDC) ───────────────────────────────────────────
  publish:
    name: Publish to pub.dev
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skipped for the initial release. After the first manual publish and OIDC
    # setup on pub.dev, this runs automatically on every tag push.
    if: ${{ github.event.inputs.skip_publish != 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Publish to pub.dev (OIDC)
        run: dart pub publish --force

  # ── 3. GitHub Release + Slack ──────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}

